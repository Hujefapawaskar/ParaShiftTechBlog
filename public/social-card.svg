<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="ParaShift Blog social share card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="45%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="170" cy="110" r="140" fill="#a855f7" opacity="0.22"/>
  <circle cx="1020" cy="520" r="190" fill="#22d3ee" opacity="0.2"/>
  <rect x="90" y="90" width="1020" height="450" rx="30" fill="#0f172a" opacity="0.65"/>
  <text x="140" y="245" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="70" font-weight="800">ParaShift Blog</text>
  <text x="140" y="320" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="500">Modern reads on tech, ideas, and practical learning.</text>
  <rect x="140" y="375" width="390" height="64" rx="32" fill="url(#accent)"/>
  <text x="190" y="418" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">Explore Latest Blogs</text>
</svg>
